      { id: 298, japanese: "ゆっくりと", meaning: "천천히", pronunciation: "윳쿠리토", example: "예문: 속도를 낮출 때 사용합니다." },
      { id: 299, japanese: "すぐ終わります", meaning: "곧 끝납니다", pronunciation: "스구 오와리마스", example: "예문: 작업 종료를 알릴 때 사용합니다." },
      { id: 300, japanese: "お会いできて嬉しいです", meaning: "뵙게 되어 기쁩니다", pronunciation: "오아이 데키테 우레시이데스", example: "예문: 만남의 기쁨을 표현할 때 사용합니다." }
    ];
    
    // 전역 변수
    var currentDay = 0;
    var currentExpressions = [];
    var studyIndex = 0;
    var quizIndex = 0;
    var score = 0;
    
    // 첫 화면: 일차 선택
    function renderDaySelection() {
      var container = document.getElementById("container");
      var html = "<h1>일본어 회화 학습 프로그램</h1>";
      html += "<p>학습할 일차를 선택하세요:</p>";
      html += "<select id='daySelect'>";
      for (var i = 1; i <= 30; i++) {
        html += "<option value='" + i + "'>" + i + "일차</option>";
      }
      html += "</select>";
      html += "<br><button class='button' onclick='startDay()'>선택</button>";
      container.innerHTML = html;
    }
    
    // 일차 선택 후 해당 일차의 10개 표현 로딩 및 학습 모드 시작
    function startDay() {
      var day = parseInt(document.getElementById("daySelect").value);
      currentDay = day;
      // 1일차: 인덱스 0~9, 2일차: 10~19, ... 30일차: 290~299
      currentExpressions = expressions.slice((day - 1) * 10, day * 10);
      studyIndex = 0;
      renderStudyExpression();
    }
    
    // 학습 모드: 한 문장씩 표현을 보여주기
    function renderStudyExpression() {
      var container = document.getElementById("container");
      if (studyIndex < currentExpressions.length) {
        var expr = currentExpressions[studyIndex];
        var html = "<h2>" + currentDay + "일차 학습 (" + (studyIndex + 1) + " / " + currentExpressions.length + ")</h2>";
        html += "<div class='expression'>";
        html += "<p><strong>일본어:</strong> " + expr.japanese + " (" + expr.pronunciation + ")</p>";
        html += "<p><strong>뜻:</strong> " + expr.meaning + "</p>";
        html += "<p><strong>예문:</strong> " + expr.example + "</p>";
        html += "</div>";
        // 마지막 표현이 아니면 "다음" 버튼, 마지막이면 "퀴즈 시작" 버튼 표시
        if (studyIndex < currentExpressions.length - 1) {
          html += "<button class='button' onclick='nextExpression()'>다음</button>";
        } else {
          html += "<button class='button' onclick='startQuiz()'>퀴즈 시작</button>";
        }
        container.innerHTML = html;
      }
    }
    
    function nextExpression() {
      studyIndex++;
      renderStudyExpression();
    }
    
    // 퀴즈 모드 시작 (표현 10개에 대해 퀴즈)
    function startQuiz() {
      quizIndex = 0;
      score = 0;
      renderQuizQuestion();
    }
    
    // 퀴즈 문제 출력: 해당 표현의 뜻을 제시하고 4지 선다 객관식 (정답 + 3개 오답)
    function renderQuizQuestion() {
      var container = document.getElementById("container");
      if (quizIndex >= currentExpressions.length) {
        renderResult();
        return;
      }
      var currentExpr = currentExpressions[quizIndex];
      var html = "<h2>퀴즈 " + (quizIndex + 1) + " / " + currentExpressions.length + "</h2>";
      html += "<p><strong>뜻:</strong> " + currentExpr.meaning + "</p>";
      // 옵션 생성: 정답 + 무작위 오답 3개
      var options = [];
      options.push(currentExpr);
      while(options.length < 4) {
        var randIndex = Math.floor(Math.random() * expressions.length);
        var candidate = expressions[randIndex];
        if (!options.some(function(opt){ return opt.japanese === candidate.japanese; })) {
          options.push(candidate);
        }
      }
      // 옵션 섞기
      options.sort(function(){ return 0.5 - Math.random(); });
      
      html += "<form id='quizForm'>";
      options.forEach(function(opt, index) {
        html += "<div class='option'><input type='radio' name='option' value='" + opt.japanese + "' id='option" + index + "'>";
        html += "<label for='option" + index + "'>" + opt.japanese + " (" + opt.pronunciation + ")</label></div>";
      });
      html += "</form>";
      html += "<button class='button' onclick='checkAnswer()'>정답 제출</button>";
      container.innerHTML = html;
    }
    
    function checkAnswer() {
      var form = document.getElementById("quizForm");
      var options = form.elements["option"];
      var selected = null;
      for(var i = 0; i < options.length; i++){
        if(options[i].checked){
          selected = options[i].value;
          break;
        }
      }
      if(selected === null){
        alert("옵션을 선택하세요.");
        return;
      }
      var correctAnswer = currentExpressions[quizIndex].japanese;
      if(selected === correctAnswer){
        score += 10;
      }
      quizIndex++;
      renderQuizQuestion();
    }
    
    function renderResult() {
      var container = document.getElementById("container");
      var html = "<h2>퀴즈 결과</h2>";
      html += "<p>최종 점수: " + score + "점</p>";
      html += "<button class='button' onclick='renderDaySelection()'>처음으로</button>";
      container.innerHTML = html;
    }
    
    window.onload = function() {
      renderDaySelection();
    };
  </script>
